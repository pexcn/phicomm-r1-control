<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DLNA设备扫描工具</title>
    <!--<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1a2a6c, #2c3e50);
        color: #fff;
        min-height: 100vh;
        padding: 0px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 15px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-size: 2.8rem;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #00c9ff, #92fe9d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      }

      .subtitle {
        font-size: 1.2rem;
        opacity: 0.8;
        max-width: 700px;
        margin: 0 auto;
        line-height: 1.6;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 1fr;
        gap: 25px;
        margin-bottom: 30px;
      }

      .card {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }

      .card-title {
        display: flex;
        align-items: center;
        font-size: 1.4rem;
        margin-bottom: 20px;
        color: #4fc3f7;
      }

      .card-title i {
        margin-right: 12px;
        font-size: 1.8rem;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .btn-group {
        display: flex;
        gap: 15px;
        margin-top: 10px;
      }

      button {
        flex: 1;
        padding: 15px 20px;
        border: none;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .btn-scan {
        background: linear-gradient(90deg, #00c9ff, #92fe9d);
        color: #1a2a6c;
      }

      .btn-stop {
        background: linear-gradient(90deg, #ff416c, #ff4b2b);
        color: white;
      }

      button:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      button:active {
        transform: scale(0.98);
      }

      button:disabled {
        opacity: 0.6;
        transform: none;
        cursor: not-allowed;
      }

      .status {
        display: flex;
        align-items: center;
        padding: 15px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
        margin-top: 15px;
      }

      .status-indicator {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        margin-right: 12px;
      }

      .idle {
        background: #aaa;
      }

      .scanning {
        background: #00e676;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
        }
      }

      #chart {
        height: 300px;
        width: 100%;
      }

      .devices-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-height: 400px;
        overflow-y: auto;
        padding-right: 10px;
      }

      .device-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        align-items: center;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .device-card.new {
        animation: highlight 1s ease;
      }

      .device-card:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateX(5px);
      }

      .device-card.active {
        background: rgba(52, 152, 219, 0.2);
      }

      .device-icon {
        font-size: 2.2rem;
        min-width: 60px;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 201, 255, 0.2);
        border-radius: 50%;
        margin-right: 20px;
      }

      .device-info {
        flex: 1;
        overflow: hidden;
        max-width: 100%;
      }

      .device-name {
        font-size: 1.3rem;
        font-weight: 600;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 90%;
      }

      .device-host {
        font-size: 1rem;
        opacity: 0.8;
        max-width: 98%;
      }

      .device-ip {
        font-size: 1rem;
        opacity: 0.8;
      }

      .device-type {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.85rem;
        margin-top: 8px;
        background: rgba(146, 254, 157, 0.2);
      }

      .device-protocol {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 8px;
            margin-left: 5px;
            background: rgba(255, 204, 0, 0.2);
        }

      .device-details {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: none;
        max-width: 90%;
      }

      .device-details p {
        margin: 8px 0;
        font-size: 0.95rem;
        word-break: break-all;
      }

      .device-details strong {
        display: inline-block;
        min-width: 30px;
        color: #4fc3f7;
      }

      footer {
        text-align: center;
        margin-top: 40px;
        padding: 20px;
        font-size: 0.9rem;
        opacity: 0.7;
      }

      /* 滚动条样式 */
      .devices-list::-webkit-scrollbar {
        width: 8px;
      }

      .devices-list::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 4px;
      }

      .devices-list::-webkit-scrollbar-thumb {
        background: rgba(0, 201, 255, 0.5);
        border-radius: 4px;
      }

      @keyframes highlight {
        0% {
          background: rgba(46, 204, 113, 0.3);
          transform: scale(1.05);
        }
        100% {
          background: rgba(255, 255, 255, 0.1);
          transform: scale(1);
        }
      }

      @media (max-width: 768px) {
        .dashboard {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 2.2rem;
        }

        .btn-group {
          flex-direction: column;
        }

        .device-name {
          font-size: 1.1rem;
          white-space: normal;
        }
      }

      .chart-container {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .chart-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 20px;
      }

      .stat-item {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
        padding: 10px;
        text-align: center;
      }

      .stat-item i {
        font-size: 1.5rem;
        margin-bottom: 5px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1><i class="fas fa-wifi"></i> DLNA设备扫描工具</h1>
        <!--<p class="subtitle">
          使用SSDP协议扫描局域网中的DLNA设备，包括智能电视、媒体服务器等
        </p>-->
      </header>

      <div class="dashboard">
        <div class="card">
          <div class="card-title">
            <i class="fas fa-network-wired"></i> 网络控制面板
          </div>
          <div class="controls">
            <p>
              点击下方按钮开始扫描网络中的设备。扫描可能需要几秒钟时间，请耐心等待。
            </p>
            <div class="btn-group">
              <button id="scanBtn" class="btn-scan">
                <i class="fas fa-search"></i> 开始扫描
              </button>
              <button id="stopBtn" class="btn-stop" disabled>
                <i class="fas fa-stop"></i> 停止扫描
              </button>

              <button
                onclick="mdns()"
                style="
                  color: white;
                  background: linear-gradient(45deg, #3498db, #2980b9);
                "
              >
                <i class="fa fa-wifi"></i> AirPlay设备扫描
              </button>
            </div>

            <div class="status">
              <div id="statusIndicator" class="status-indicator idle"></div>
              <span id="statusText">等待环境初始化...</span>
            </div>
          </div>
        </div>

        <div class="card" style="display: none">
          <div class="card-title">
            <i class="fas fa-chart-pie"></i> 设备分布统计
          </div>
          <div class="chart-container">
            <div id="chart"></div>
            <div class="chart-stats" style="display: none">
              <div class="stat-item">
                <i class="fas fa-tv"></i>
                智能电视: <span id="tvCount">0</span>
              </div>
              <div class="stat-item">
                <i class="fas fa-server"></i>
                媒体服务器: <span id="serverCount">0</span>
              </div>
              <div class="stat-item">
                <i class="fas fa-speaker"></i>
                智能音箱: <span id="speakerCount">0</span>
              </div>
              <div class="stat-item">
                <i class="fas fa-gamepad"></i>
                游戏主机: <span id="gameCount">0</span>
              </div>
            </div>
          </div>
        </div>

        <div class="card" style="grid-column: 1 / -1">
          <div class="card-title">
            <i class="fas fa-laptop"></i> 发现的设备列表
          </div>
          <div class="devices-list" id="devicesList"></div>
        </div>
      </div>

      <footer>
        <p>DLNA设备扫描工具</p>
      </footer>
    </div>

    <script>
      function mdns() {
        try {
          document.getElementById("stopBtn").click();
        } catch {}
        location.href = "./mdns.html?" + Date.now();
      }
      // 全局变量
      let isSearching = false;
      let devices = [];
      let socket = null;
      let multicastLock = null;
      let receiveLoopTimeout = null;
      let discoveredDevices = new Set();
      let chart = null;

      // DOM元素
      const scanBtn = document.getElementById("scanBtn");
      const stopBtn = document.getElementById("stopBtn");
      const statusIndicator = document.getElementById("statusIndicator");
      const statusText = document.getElementById("statusText");
      const devicesList = document.getElementById("devicesList");
      const tvCount = document.getElementById("tvCount");
      const serverCount = document.getElementById("serverCount");
      const speakerCount = document.getElementById("speakerCount");
      const gameCount = document.getElementById("gameCount");

      // 更新状态显示
      function updateStatus(text, isScanning) {
        statusText.textContent = text;
        statusIndicator.className =
          "status-indicator " + (isScanning ? "scanning" : "idle");
        scanBtn.disabled = isScanning;
        stopBtn.disabled = !isScanning;
      }

      // 初始化图表
      function initChart() {
        const chartDom = document.getElementById("chart");
        chart = echarts.init(chartDom);

        const option = {
          tooltip: {
            trigger: "item",
            formatter: "{a} <br/>{b}: {c} ({d}%)",
          },
          legend: {
            orient: "vertical",
            right: 10,
            top: "center",
            textStyle: {
              color: "rgba(255, 255, 255, 0.8)",
            },
          },
          series: [
            {
              name: "设备类型",
              type: "pie",
              radius: ["40%", "70%"],
              avoidLabelOverlap: false,
              itemStyle: {
                borderRadius: 10,
                borderColor: "#1a2a6c",
                borderWidth: 2,
              },
              label: {
                show: false,
                position: "center",
              },
              emphasis: {
                label: {
                  show: true,
                  fontSize: "18",
                  fontWeight: "bold",
                  color: "#fff",
                },
              },
              labelLine: {
                show: false,
              },
              data: [],
            },
          ],
        };

        chart.setOption(option);

        // 处理窗口大小变化
        window.addEventListener("resize", function () {
          chart.resize();
        });
      }

      // 开始设备发现
      function startDiscovery() {
        if (isSearching) return;

        isSearching = true;
        discoveredDevices.clear();
        devices = [];
        updateStatus("正在初始化设备扫描...", true);

        // 清空设备列表
        while (devicesList.children.length > 0) {
          devicesList.removeChild(devicesList.lastChild);
        }

        // 更新设备计数
        updateDeviceCount();

        // 确保在plus环境中
        if (!window.plus) {
          updateStatus("错误：当前环境不支持HTML5+", false);
          isSearching = false;
          return;
        }

        // 开始扫描
        setTimeout(discoverDevices, 500);
      }

      // 发现DLNA设备
      function discoverDevices() {
        if (!isSearching) return;

        try {
          // 导入必要的Java类
          const Context = plus.android.importClass("android.content.Context");
          const InetAddress = plus.android.importClass("java.net.InetAddress");
          const DatagramSocket = plus.android.importClass(
            "java.net.DatagramSocket"
          );
          const DatagramPacket = plus.android.importClass(
            "java.net.DatagramPacket"
          );
          const String = plus.android.importClass("java.lang.String");

          // 创建UDP套接字
          socket = new DatagramSocket(null);
          plus.android.importClass(socket);
          socket.setBroadcast(true);

          // 设置组播地址
          const group = InetAddress.getByName("239.255.255.250");

          // 发送SSDP搜索请求
          const searchMessage =
            "M-SEARCH * HTTP/1.1\r\n" +
            "HOST: 239.255.255.250:1900\r\n" +
            'MAN: "ssdp:discover"\r\n' +
            "MX: 3\r\n" +
            "ST: ssdp:all\r\n" +
            "\r\n";

          const sendData = new String(searchMessage).getBytes();
          const sendPacket = new DatagramPacket(
            sendData,
            sendData.length,
            group,
            1900
          );

          // 发送搜索请求
          socket.send(sendPacket);

          // 设置超时
          socket.setSoTimeout(600);

          // 准备接收缓冲区
          const Byte = plus.android.importClass("java.lang.Byte");
          const Array = plus.android.importClass("java.lang.reflect.Array");
          const buffer = Array.newInstance(Byte.TYPE, 4096);
          const receivePacket = new DatagramPacket(buffer, buffer.length);

          // 记录开始时间
          const startTime = Date.now();

          // 更新状态
          updateStatus("正在扫描网络中的设备...", true);

          // 持续接收响应
          const receiveLoop = () => {
            if (!isSearching || Date.now() - startTime >= 10000) {
              // 10秒超时
              completeDiscovery();
              return;
            }

            try {
              socket.receive(receivePacket);
              const response = new String(receivePacket.getData(), "UTF-8");
              const address = receivePacket.getAddress();
              plus.android.importClass(address);
              parseResponse(
                response,
                address.getHostAddress(),
                address.getHostName()
              );
              receiveLoopTimeout = setTimeout(receiveLoop, 100);
            } catch (e) {
              console.log(e);
              completeDiscovery();
              // 超时或错误时继续监听
              //receiveLoopTimeout = setTimeout(receiveLoop, 600);
            }
          };

          receiveLoopTimeout = setTimeout(receiveLoop, 0);
        } catch (e) {
          console.error("SSDP错误: ", e);
          updateStatus("SSDP错误: " + e.message, false);
          completeDiscovery();
        }
      }

      // 解析SSDP响应
      function parseResponse(response, ip, host) {
        const lines = response.split("\r\n");
        const device = {
          ip,
          host,
          headers: {},
        };

        lines.forEach(function (line) {
          const index = line.indexOf(":");
          if (index > 0) {
            const key = line.substring(0, index).trim().toUpperCase();
            const value = line.substring(index + 1).trim();
            device.headers[key] = value;
          }
        });

        // 检查是否有效设备
        if (device.headers["ST"] || device.headers["USN"]) {
          const usn = device.headers["USN"];

          // 检查是否是新设备
          if (!discoveredDevices.has(usn)) {
            discoveredDevices.add(usn);

            // 提取设备信息
            const deviceInfo = {
              ip: ip,
              host: host,
              usn: usn,
              location: device.headers["LOCATION"] || "",
              server: device.headers["SERVER"] || "",
              type: determineDeviceType(device.headers["SERVER"]),
              name: extractDeviceName(device.headers["SERVER"]),
              model: extractDeviceModel(device.headers["SERVER"]),
              manufacturer: extractManufacturer(device.headers["SERVER"]),
            };

            if (devices.find((info) => info.location === deviceInfo.location))
              return;

            // 添加到设备列表
            devices.push(deviceInfo);

            // 更新设备计数
            updateDeviceCount();
            fetchDeviceDetails(deviceInfo);
          }
        }
      }

      // 获取设备详细信息
      function fetchDeviceDetails(deviceInfo) {
        if (!deviceInfo.location) {
          // 没有位置信息，直接显示
          addDeviceToList(deviceInfo);
          return;
        }

        // 使用plus.net.XMLHttpRequest获取设备描述文档
        const xhr = new plus.net.XMLHttpRequest();
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              try {
                // 解析XML响应
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(
                  xhr.responseText,
                  "text/xml"
                );

                // 提取设备信息
                const deviceElement = xmlDoc.getElementsByTagName("device")[0];
                if (deviceElement) {
                  deviceInfo.name =
                    getXmlValue(deviceElement, "friendlyName") ||
                    deviceInfo.name;
                  deviceInfo.manufacturer =
                    getXmlValue(deviceElement, "manufacturer") ||
                    deviceInfo.manufacturer;
                  deviceInfo.model =
                    getXmlValue(deviceElement, "modelName") || deviceInfo.model;
                }
              } catch (e) {
                console.error("解析设备描述失败: ", e);
              }
            }

            // 添加到设备列表
            addDeviceToList(deviceInfo);
          }
        };

        try {
          xhr.open("GET", deviceInfo.location);
          xhr.send();
        } catch (e) {
          console.error("获取设备描述失败: ", e);
          addDeviceToList(deviceInfo);
        }
      }

      // 从XML节点获取值
      function getXmlValue(parent, tagName) {
        const elements = parent.getElementsByTagName(tagName);
        if (elements.length > 0) {
          return elements[0].textContent;
        }
        return null;
      }

      // 确定设备类型
      function determineDeviceType(serverHeader) {
        if (!serverHeader) return "其他";

        if (
          serverHeader.includes("TV") ||
          serverHeader.includes("Television") ||
          serverHeader.includes("SmartTV")
        ) {
          return "智能电视";
        }

        if (
          serverHeader.includes("Media Server") ||
          serverHeader.includes("DLNAServer") ||
          serverHeader.includes("UPnP")
        ) {
          return "媒体服务器";
        }

        if (
          serverHeader.includes("Speaker") ||
          serverHeader.includes("SoundBar") ||
          serverHeader.includes("Audio")
        ) {
          return "智能音箱";
        }

        if (
          serverHeader.includes("PlayStation") ||
          serverHeader.includes("Xbox")
        ) {
          return "游戏主机";
        }

        return "其他";
      }

      // 提取设备名称
      function extractDeviceName(serverHeader) {
        if (!serverHeader) return "未知设备";

        // 尝试提取更友好的名称
        const match = serverHeader.match(/([a-zA-Z0-9\s\-]+)\/[0-9\.]+/);
        if (match && match[1]) {
          return match[1].trim();
        }

        return serverHeader.split("/")[0] || "DLNA设备";
      }

      // 提取设备型号
      function extractDeviceModel(serverHeader) {
        if (!serverHeader) return "未知";

        const parts = serverHeader.split(" ");
        if (parts.length > 1) {
          return parts[1];
        }

        return serverHeader;
      }

      // 提取制造商
      function extractManufacturer(serverHeader) {
        if (!serverHeader) return "未知";

        if (serverHeader.includes("Samsung")) return "三星";
        if (serverHeader.includes("Sony")) return "索尼";
        if (serverHeader.includes("LG")) return "LG";
        if (serverHeader.includes("Panasonic")) return "松下";
        if (serverHeader.includes("Xiaomi")) return "小米";
        if (serverHeader.includes("Philips")) return "飞利浦";

        return serverHeader.split(" ")[0] || "未知";
      }

      // 更新设备计数和图表
      function updateDeviceCount() {
        const counts = {
          智能电视: 0,
          媒体服务器: 0,
          智能音箱: 0,
          游戏主机: 0,
          其他: 0,
        };

        devices.forEach((device) => {
          if (counts.hasOwnProperty(device.type)) {
            counts[device.type]++;
          } else {
            counts["其他"]++;
          }
        });

        // 更新统计数字
        tvCount.textContent = counts["智能电视"];
        serverCount.textContent = counts["媒体服务器"];
        speakerCount.textContent = counts["智能音箱"];
        gameCount.textContent = counts["游戏主机"];
        if (!chart) return;
        // 更新饼图
        const chartData = [
          { value: counts["智能电视"], name: "智能电视" },
          { value: counts["媒体服务器"], name: "媒体服务器" },
          { value: counts["智能音箱"], name: "智能音箱" },
          { value: counts["游戏主机"], name: "游戏主机" },
          { value: counts["其他"], name: "其他" },
        ];

        chart.setOption({
          series: [
            {
              data: chartData,
            },
          ],
        });
      }

      // 添加设备到列表
      function addDeviceToList(deviceInfo) {
        const deviceCard = document.createElement("div");
        deviceCard.className = "device-card";//new

        // 根据设备类型选择图标
        let iconClass = "fas fa-laptop";
        let deviceType = "DLNA设备";

        if (deviceInfo.type.includes("电视")) {
          iconClass = "fas fa-tv";
          deviceType = "智能电视";
        } else if (deviceInfo.type.includes("服务器")) {
          iconClass = "fas fa-server";
          deviceType = "媒体服务器";
        } else if (deviceInfo.type.includes("音箱")) {
          iconClass = "fas fa-speaker";
          deviceType = "智能音箱";
        } else if (deviceInfo.type.includes("游戏")) {
          iconClass = "fas fa-gamepad";
          deviceType = "游戏主机";
        }

        // 处理长名称
        const deviceName = deviceInfo.name || deviceInfo.model || "未知设备";

        deviceCard.innerHTML = `
                 <div class="device-icon">
                     <i class="${iconClass}"></i>
                 </div>
                 <div class="device-info">
                     <div class="device-name" >${deviceName}</div>
                     <div class="device-ip">IP: ${deviceInfo.ip}</div>
      <!--<div class="device-host">HOST: ${deviceInfo.host}</div>-->
                     <div class="device-type">类型: ${deviceType}</div>
                     <div class="device-details">
                         <p><strong>厂商:</strong> ${
                           deviceInfo.manufacturer || "未知"
                         }</p>
                         <p><strong>型号:</strong> ${
                           deviceInfo.model || "未知"
                         }</p>
                         <p><strong>标识:</strong> ${deviceInfo.usn}</p>
                         ${
                           deviceInfo.location
                             ? `<p><strong>URL:</strong> ${deviceInfo.location}</p>`
                             : ""
                         }
                     </div>
                 </div>
             `;

        // 添加点击事件
        deviceCard.addEventListener("click", function () {
          const details = this.querySelector(".device-details");

          // 移除其他设备的active类
          document.querySelectorAll(".device-card").forEach((card) => {
            if (card == this) return;
            card.classList.remove("active");
            const details = card.querySelector(".device-details");
            if (details && details.style) details.style.display = "none";
          });

          // 切换当前设备的active状态
          if (this.classList.contains("active")) {
            this.classList.remove("active");
            details.style.display = "none";
          } else {
            this.classList.toggle("active");
            details.style.display = "block";
          }
        });

        // 添加到列表顶部
        devicesList.insertBefore(deviceCard, devicesList.firstChild);
      }

      // 完成发现
      function completeDiscovery() {
        isSearching = false;

        // 更新状态
        if (devices.length > 0) {
          updateStatus(`扫描完成，共发现 ${devices.length} 个设备`, false);
        } else {
          updateStatus("扫描完成，未发现设备", false);
        }

        // 清理资源
        if (socket) {
          try {
            socket.close();
          } catch (e) {}
          socket = null;
        }

        if (multicastLock) {
          try {
			multicastLock.release();
          } catch (e) {}
          multicastLock = null;
        }

        // 清除接收循环
        if (receiveLoopTimeout) {
          clearTimeout(receiveLoopTimeout);
          receiveLoopTimeout = null;
        }
      }

      // 停止设备发现
      function stopDiscovery() {
        isSearching = false;

        // 更新状态
        updateStatus("扫描已停止", false);

        // 清理资源
        if (socket) {
          try {
            plus.android.invoke(socket, "close");
          } catch (e) {}
          socket = null;
        }

        if (multicastLock) {
          try {
			      multicastLock.release();
          } catch (e) {}
            multicastLock = null;
        }

        if (receiveLoopTimeout) {
          clearTimeout(receiveLoopTimeout);
          receiveLoopTimeout = null;
        }
      }

      // 初始化
      function init() {
        // 在plus ready后请求权限
        document.addEventListener("plusready", function () {
          plus.android.requestPermissions(
            [
              "android.permission.INTERNET",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE",
            ],
            function () {
              console.log("权限已获取");
              initSSDP();
            },
            function (e) {
              console.error("权限被拒绝: ", e);
              updateStatus("错误：权限被拒绝，无法扫描设备", false);
            }
          );
        });
      }

      function initSSDP() {
        try {
          // 导入必要的Java类
          const Context = plus.android.importClass("android.content.Context");
          const WifiManager = plus.android.importClass(
            "android.net.wifi.WifiManager"
          );
          const StrictMode = plus.android.importClass("android.os.StrictMode");
          const ThreadPolicy = plus.android.importClass(
            "android.os.StrictMode$ThreadPolicy"
          );

          // 获取WifiManager
          const wifiManager = plus.android
            .runtimeMainActivity()
            .getSystemService(Context.WIFI_SERVICE);

          // 创建多播锁
          try {
            multicastLock = wifiManager.createMulticastLock("DLNADiscovery");
            plus.android.importClass(multicastLock);
            multicastLock.acquire();
          } catch (e) {}

          // 放宽线程策略
          const policy = new ThreadPolicy.Builder().permitAll().build();
          StrictMode.setThreadPolicy(policy);

          updateStatus("就绪 - 点击开始扫描按钮", false);
          const deviceCard = document.createElement("div");
          deviceCard.className = "device-card";
          deviceCard.innerHTML = `
              <div class="device-icon">
                <i class="fas fa-search"></i>
              </div>
             <div class="device-info">
               <div class="device-name">等待扫描结果</div>
                <div class="device-ip">点击"开始扫描"按钮发现网络设备</div>
                <div class="device-type">状态: 就绪</div>
              </div>
          `;
          devicesList.appendChild(deviceCard);

          // 初始化图表
          //initChart();

          // 事件绑定
          scanBtn.addEventListener("click", startDiscovery);
          stopBtn.addEventListener("click", stopDiscovery);

          return true;
        } catch (e) {
          console.error("initSSDP错误: ", e);
          updateStatus("initSSDP错误: " + e.message, false);
        }
      }

      // 页面加载完成后初始化
      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
