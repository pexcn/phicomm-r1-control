<!DOCTYPE html>
<html lang="zh-CN">
	<head>
    <script src="../js/deployment.js"></script>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="format-detection" content="telephone=no" />
		<title>R1音箱配网助手</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<script src="../jquery-3.6.0.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js';document.head.appendChild(s)"></script>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			}

			body {
				background: linear-gradient(135deg, #1a2a6c, #2c3e50);
				color: #fff;
				min-height: 100vh;
				padding: 0;
				overflow-x: hidden;
			}

			.container {
				max-width: 800px;
				margin: 0 auto;
				padding: 20px;
			}

			header {
				text-align: center;
				margin-bottom: 30px;
				padding: 20px;
				background: rgba(0, 0, 0, 0.2);
				border-radius: 15px;
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
				position: relative;
				overflow: hidden;
			}

			.header-bg {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: radial-gradient(circle at top right,
						rgba(0, 201, 255, 0.1),
						transparent 70%);
				z-index: -1;
			}

			h1 {
				font-size: 2.8rem;
				margin-bottom: 10px;
				background: linear-gradient(90deg, #00c9ff, #92fe9d);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
			}

			.subtitle {
				font-size: 1.2rem;
				opacity: 0.8;
				max-width: 700px;
				margin: 0 auto;
				line-height: 1.6;
			}

			.dashboard {
				display: block;
				grid-template-columns: 1fr;
				gap: 25px;
				margin-bottom: 30px;
			}

			.card {
				background: rgba(255, 255, 255, 0.08);
				border-radius: 15px;
				padding: 25px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
				backdrop-filter: blur(10px);
				border: 1px solid rgba(255, 255, 255, 0.1);
				transition: transform 0.3s ease, box-shadow 0.3s ease;
				padding: 20px;
				margin: 25px 0 0 0;
			}

			.card:hover {
				transform: translateY(-5px);
				box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
			}

			.card-title {
				display: flex;
				align-items: center;
				font-size: 1.4rem;
				margin-bottom: 20px;
				color: #4fc3f7;
			}

			.card-title i {
				margin-right: 12px;
				font-size: 1.8rem;
			}

			.status {
				display: flex;
				align-items: center;
				padding: 15px;
				background: rgba(0, 0, 0, 0.2);
				border-radius: 10px;
				margin: 15px 0;
			}

			.status-indicator {
				min-width: 15px;
				height: 15px;
				border-radius: 50%;
				margin-right: 12px;
			}

			.idle {
				background: #aaa;
			}

			.scanning {
				background: #00e676;
				animation: pulse 1.5s infinite;
			}

			.error {
				background: #ff416c;
				animation: pulse 1.5s infinite;
			}

			@keyframes pulse {
				0% {
					opacity: 0.6;
				}

				50% {
					opacity: 1;
				}

				100% {
					opacity: 0.6;
				}
			}

			.form-group {
				margin-bottom: 20px;
			}

			.form-label {
				display: block;
				margin-bottom: 8px;
				font-size: 1.1rem;
				color: #4fc3f7;
			}

			.form-input {
				width: 100%;
				padding: 14px 16px;
				border-radius: 12px;
				border: 1px solid rgba(255, 255, 255, 0.2);
				background: rgba(0, 0, 0, 0.15);
				color: #fff;
				font-size: 1rem;
				transition: all 0.3s ease;
			}

			.form-input:focus {
				outline: none;
				border-color: #00c9ff;
				box-shadow: 0 0 0 3px rgba(0, 201, 255, 0.2);
			}

			.form-select {
				width: 100%;
				padding: 14px 16px;
				border-radius: 12px;
				border: 1px solid rgba(255, 255, 255, 0.2);
				background: rgba(0, 0, 0, 0.15);
				color: #fff;
				font-size: 1rem;
				transition: all 0.3s ease;
			}

			.btn-group {
				display: flex;
				gap: 15px;
				margin-top: 20px;
			}

			button {
				flex: 1;
				padding: 15px 20px;
				border: none;
				border-radius: 50px;
				font-size: 1.1rem;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.3s ease;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
			}

			.btn-scan {
				background: linear-gradient(90deg, #00c9ff, #92fe9d);
				color: #1a2a6c;
			}

			.btn-stop {
				background: linear-gradient(90deg, #ff416c, #ff4b2b);
				color: white;
			}

			.btn-secondary {
				background: rgba(255, 255, 255, 0.1);
				color: #fff;
			}

			.btn-refresh {
				background: linear-gradient(90deg, #ffb347, #ffcc33);
				color: #1a2a6c;
			}

			button:hover {
				transform: scale(1.05);
				box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
			}

			button:active {
				transform: scale(0.98);
			}

			button:disabled {
				opacity: 0.6;
				transform: none;
				cursor: not-allowed;
			}

			.steps {
				display: flex;
				flex-direction: column;
				gap: 15px;
				margin: 20px 0;
			}

			.step {
				display: flex;
				align-items: flex-start;
				gap: 15px;
				padding: 15px;
				background: rgba(255, 255, 255, 0.05);
				border-radius: 12px;
				transition: all 0.3s ease;
			}

			.step:hover {
				background: rgba(255, 255, 255, 0.08);
			}

			.step-number {
				min-width: 30px;
				height: 30px;
				background: linear-gradient(90deg, #00c9ff, #92fe9d);
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-weight: bold;
				color: #1a2a6c;
			}

			.step-content {
				flex: 1;
			}

			.step-title {
				font-weight: 600;
				margin-bottom: 5px;
				color: #4fc3f7;
			}

			.check-area {
				height: 150px;
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 12px;
				padding: 15px;
				background: rgba(0, 0, 0, 0.15);
				margin: 20px 0;
				overflow-y: auto;
			}

			.check-message {
				padding: 8px 0;
				border-bottom: 1px solid rgba(255, 255, 255, 0.05);
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.check-message span {
				word-wrap: break-word;
				width: 90%;
				max-width: 90%;
			}

			.check-message i {
				font-size: 1.2rem;
			}

			.check-success i {
				color: #00e676;
			}

			.check-warning i {
				color: #ffb347;
			}

			.check-error i {
				color: #ff416c;
			}

			footer {
				text-align: center;
				margin-top: 40px;
				padding: 20px;
				font-size: 0.9rem;
				opacity: 0.7;
			}

			.device-icon {
				position: absolute;
				top: 20px;
				right: 30px;
				font-size: 4rem;
				color: rgba(255, 255, 255, 0.1);
			}

			.wifi-list-container {
				max-height: 200px;
				overflow-y: auto;
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 12px;
				margin: 15px 0;
				background: rgba(0, 0, 0, 0.15);
			}

			.wifi-item {
				padding: 12px 15px;
				border-bottom: 1px solid rgba(255, 255, 255, 0.05);
				display: flex;
				align-items: center;
				cursor: pointer;
				transition: all 0.2s ease;
			}

			.wifi-item:last-child {
				border-bottom: none;
			}

			.wifi-item:hover {
				background: rgba(255, 255, 255, 0.08);
			}

			.wifi-item.selected {
				background: rgba(0, 201, 255, 0.15);
			}

			.wifi-icon {
				margin-right: 15px;
				font-size: 1.5rem;
				color: #4fc3f7;
			}

			.wifi-info {
				flex: 1;
			}

			.wifi-name {
				font-weight: 600;
				margin-bottom: 3px;
			}

			.wifi-details {
				display: flex;
				font-size: 0.85rem;
				opacity: 0.8;
			}

			.wifi-security {
				margin-right: 15px;
			}

			.wifi-mac {
				margin-right: 15px;
				min-width: 120px;
				text-align: center;
			}

			.wifi-strength {
				display: flex;
				align-items: center;
			}

			.strength-bar {
				display: flex;
				gap: 2px;
				margin-left: 5px;
			}

			.bar {
				width: 3px;
				height: 10px;
				background: rgba(255, 255, 255, 0.3);
			}

			.bar.active {
				background: #00e676;
			}

			.loading {
				display: flex;
				justify-content: center;
				padding: 20px;
			}

			.loading i {
				font-size: 2rem;
				color: #00c9ff;
				animation: spin 1.5s linear infinite;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}

				100% {
					transform: rotate(360deg);
				}
			}

			.tab-container {
				display: flex;
				margin-bottom: 20px;
				background: rgba(0, 0, 0, 0.15);
				border-radius: 12px;
				overflow: hidden;
			}

			.tab {
				flex: 1;
				padding: 15px;
				text-align: center;
				cursor: pointer;
				transition: all 0.3s ease;
			}

			.tab.active {
				background: rgba(0, 201, 255, 0.2);
			}

			.tab-content {
				display: none;
			}

			.tab-content.active {
				display: block;
			}

			@media (max-width: 768px) {
				h1 {
					font-size: 2.2rem;
				}

				.btn-group {
					flex-direction: column;
				}

				.card {
					padding: 20px;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<header>
				<div class="header-bg"></div>
				<i class="fas fa-speaker device-icon"></i>
				<h1><i class="fas fa-wifi"></i> R1音箱配网助手</h1>
				<!--<p class="subtitle"></p>-->
			</header>

			<div class="dashboard">
				<div class="card">
					<div class="card-title">
						<i class="fas fa-info-circle"></i> 配网指南
					</div>

					<div class="steps">
						<div class="step">
							<div class="step-number">1</div>
							<div class="step-content">
								<div class="step-title">启动音箱配网模式</div>
								<p>
									长按音箱顶部按键5秒，直到听到提示音"开始网络配置"且底部白色灯光闪烁。
								</p>
							</div>
						</div>

						<div class="step">
							<div class="step-number">2</div>
							<div class="step-content">
								<div class="step-title">连接音箱热点</div>
								<p>
									打开手机设置，连接音箱的WiFi热点（名称类似 Phicomm_R1_XXXX）。
								</p>
							</div>
						</div>

						<div class="step">
							<div class="step-number">3</div>
							<div class="step-content">
								<div class="step-title">输入WiFi信息</div>
								<p>
									返回本页面，输入您的WiFi名称和密码，然后点击"开始配网"按钮。
								</p>
							</div>
						</div>
					</div>

					<div class="status">
						<div id="statusIndicator" class="status-indicator idle"></div>
						<span id="statusText">准备配网 - 请按步骤操作</span>
					</div>

					<div class="check-area" id="checkArea">
						<div class="check-message check-warning">
							<i class="fas fa-info-circle"></i>
							<span>正在检查设备环境...</span>
						</div>
					</div>
				</div>

				<div class="card" style="display: none">
					<div class="card-title"><i class="fas fa-cogs"></i> 网络配置</div>

					<div class="tab-container" id="tabContainer" style="display: none">
						<div class="tab active" data-tab="manual">手动输入</div>
						<div class="tab" data-tab="list" id="wifiListTab">选择WiFi</div>
					</div>

					<div class="tab-content active" id="manualTab">
						<div class="form-group">
							<label class="form-label">WiFi名称 (SSID)</label>
							<input type="text" id="ssid" class="form-input" placeholder="输入您的WiFi名称"
								autocomplete="off" />
						</div>

						<div class="form-group">
							<label class="form-label">加密方式</label>
							<select id="encryption" class="form-select">
								<option value="INSECURE">无加密</option>
								<option value="WEP">WEP加密</option>
								<option value="WPA" selected>WPA加密</option>
							</select>
						</div>

						<div class="form-group">
							<label class="form-label">WiFi密码</label>
							<input type="text" id="password" class="form-input" placeholder="输入您的WiFi密码"
								autocomplete="off" />
						</div>
					</div>

					<div class="tab-content" id="listTab">
						<div class="form-group">
							<label class="form-label">选择WiFi网络</label>
							<div class="wifi-list-container" id="wifiListContainer">
								<div class="loading">
									<i class="fas fa-spinner fa-spin"></i>
								</div>
							</div>
						</div>

						<div class="btn-group" style="margin: 20px">
							<button id="refreshBtn" class="btn-refresh">
								<i class="fas fa-sync-alt"></i> 刷新WiFi列表
							</button>
						</div>

						<div class="form-group">
							<label class="form-label">WiFi密码</label>
							<input type="text" id="passwordList" class="form-input" placeholder="输入WiFi密码"
								autocomplete="off" />
						</div>
					</div>

					<div class="btn-group">
						<button id="configBtn" class="btn-scan">
							<i class="fas fa-plug"></i> 开始配网
						</button>
						<button id="backBtn" class="btn-secondary">
							<i class="fas fa-home"></i> 返回首页
						</button>
					</div>
				</div>
			</div>

			<footer>
				<p>R1音箱配网助手</p>
			</footer>
		</div>

		<script>
			// 检查是否支持IE
			if (!!window.ActiveXObject || "ActiveXObject" in window) {
				alert("抱歉，本页面不支持IE内核！");
			}

			// 更新状态显示
			function updateStatus(text, state = "idle") {
				const statusText = document.getElementById("statusText");
				const statusIndicator = document.getElementById("statusIndicator");

				statusText.textContent = text;
				statusIndicator.className = "status-indicator " + state;
			}

			// 添加检查消息
			function addCheckMessage(message, type = "warning") {
				const checkArea = document.getElementById("checkArea");
				const messageDiv = document.createElement("div");
				messageDiv.className = `check-message check-${type}`;

				const icon = document.createElement("i");

				switch (type) {
					case "success":
						icon.className = "fas fa-check-circle";
						break;
					case "error":
						icon.className = "fas fa-exclamation-circle";
						break;
					default:
						icon.className = "fas fa-info-circle";
				}

				const text = document.createElement("span");
				if (typeof message === "string") {
					text.textContent = message;
				} else {
					text.appendChild(message);
				}

				messageDiv.appendChild(icon);
				messageDiv.appendChild(text);
				checkArea.appendChild(messageDiv);

				// 自动滚动到底部
				checkArea.scrollTop = checkArea.scrollHeight;
			}

			// 清除检查消息
			function clearCheckMessages() {
				const checkArea = document.getElementById("checkArea");
				checkArea.innerHTML = "";
			}

			// 渲染WiFi列表
			function renderWifiList(wifiList) {
				const container = document.getElementById("wifiListContainer");

				if (!wifiList || wifiList.length === 0) {
					container.innerHTML = `
                    <div class="wifi-item">
                        <div class="wifi-info" style="text-align: center; padding: 20px;">
                            <i class="fas fa-wifi-slash" style="font-size: 2rem; margin-bottom: 10px;"></i>
                            <p>未发现WiFi网络，请刷新重试</p>
                        </div>
                    </div>
                `;
					return;
				}

				let html = "";

				wifiList.forEach((wifi) => {
					// 信号强度
					const strength = wifi.level;

					let strengthBars = "";
					for (let i = 1; i <= 3; i++) {
						strengthBars += `<div class="bar ${
              i <= strength ? "active" : ""
            }"></div>`;
					}

					html += `
                    <div class="wifi-item" data-ssid="${
                      wifi.ssid
                    }" data-secure="${wifi.secure}">
                        <i class="fas fa-wifi wifi-icon"></i>
                        <div class="wifi-info">
                            <div class="wifi-name">${wifi.ssid}</div>
                            <div class="wifi-details">
                                <div class="wifi-security">${
                                  wifi.secure === "INSECURE"
                                    ? "无加密"
                                    : wifi.secure
                                }</div>
      		<div class="wifi-mac">${wifi.mac}</div>
                                <div class="wifi-strength">
                                    信号:
                                    <div class="strength-bar">
                                        ${strengthBars}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
				});

				container.innerHTML = html;

				// 添加点击事件
				document.querySelectorAll(".wifi-item").forEach((item) => {
					item.addEventListener("click", function() {
						// 移除其他选择
						document.querySelectorAll(".wifi-item").forEach((i) => {
							i.classList.remove("selected");
						});

						// 添加当前选择
						this.classList.add("selected");

						// 更新表单
						const ssid = this.dataset.ssid;
						const secure = this.dataset.secure;

						// 更新手动输入表单
						document.getElementById("ssid").value = ssid;
						document.getElementById("password").value = "";

						// 更新加密方式
						const encryption = document.getElementById("encryption");
						for (let i = 0; i < encryption.options.length; i++) {
							if (encryption.options[i].value === secure) {
								encryption.selectedIndex = i;
								break;
							}
						}

						// 更新列表密码输入框
						document.getElementById("passwordList").value = "";

						// 显示成功消息
						addCheckMessage(`已选择WiFi: ${ssid} (${secure})`, "success");
						updateStatus(`已选择WiFi: ${ssid}`, "scanning");
					});
				});
			}

			// 获取WiFi列表
			function getWifiList(list = null) {
				const container = document.getElementById("wifiListContainer");
				container.innerHTML =
					'<div class="loading"><i class="fas fa-spinner fa-spin"></i></div>';

				addCheckMessage("正在扫描可用WiFi网络...", "warning");
				updateStatus("正在扫描WiFi...", "scanning");

				// 获取WiFi列表
				setTimeout(() => {
					const parseWIFIList = (data) => {
						try {
							const wifiList = JSON.parse(data);
							renderWifiList(wifiList);
							addCheckMessage(
								`扫描完成，发现${wifiList.length}个WiFi网络`,
								"success"
							);
							updateStatus("请选择要连接的WiFi", "idle");
							document.getElementById("wifiListTab").click();
							return true;
						} catch (e) {
							addCheckMessage("解析WiFi列表失败: " + e.message, "error");
							updateStatus("获取WiFi列表失败", "error");
							return false;
						}
					};
					
					if(!list) list = [];
					if (list.length && parseWIFIList(list)) return;

					const xhttp = window.plus ?
						new plus.net.XMLHttpRequest() :
						new XMLHttpRequest();
					const url = "http://192.168.43.1:8989/api/wifilist?" + Date.now();
					xhttp.open("GET", url);
					xhttp.onreadystatechange = function() {
						if (xhttp.readyState === 4) {
							if (xhttp.status === 200) {
								parseWIFIList(xhttp.responseText);
							} else {
								addCheckMessage(
									"获取WiFi列表失败，状态码: " + xhttp.status,
									"error"
								);
								updateStatus("获取WiFi列表失败", "error");
							}
						}
					};

					xhttp.onerror = function() {
						addCheckMessage("无法连接到R1音箱，请检查是否已连接热点", "error");
						updateStatus("连接失败", "error");
					};
					xhttp.send();
				}, 100);
			}

			// 初始化页面
			function initPage() {
				clearTimeout(window.timer);
				if (!window._initPage) {
					window._initPage = true;
				} else {
					if (window.plus) {
						checkConnection();
					}
					return;
				}

				// 检查端口并重定向
				if (
					!window.plus &&
					location.protocol == "https:" &&
					location.port != 8080 &&
					location.host.length
				) {
					location.href =
						"http://" +
						location.host +
						":8080" +
						location.pathname +
						location.search;
					return;
				}

				// 设置按钮事件
				document
					.getElementById("configBtn")
					.addEventListener("click", startConfig);
				document
					.getElementById("backBtn")
					.addEventListener("click", function() {
						localStorage.removeItem("app_location");
						if (window.plus) {
							plus.storage.removeItem("app_location");
							location.href = "http://r1.wxfsq.com/?no_auto_connect";
						} else {
							location.href = "../?no_auto_connect";
						}
					});
				document.getElementById("encryption").addEventListener("change", (e) => {
					const password = document.getElementById("password");
					if (e.target.value !== "INSECURE") {
						password.parentNode.style.display = '';
					} else {
						password.value = '';
						password.parentNode.style.display = 'none';
					}
				});
				/*try {
				  await fetch("");
				} catch {
				  addCheckMessage("当前环境不支持配网！", "error");
				  updateStatus("当前环境不支持配网！", "error");
				  document.getElementById("configBtn").style.display = "none";
				  document.getElementsByClassName("card")[1].style.display = "";
				  return;
				}*/


				// 从sessionStorage恢复保存的数据
				const savedSsid = sessionStorage.getItem("ssid");
				const savedSecure = sessionStorage.getItem("secure");
				const savedPassword = sessionStorage.getItem("password");

				if (savedSsid) document.getElementById("ssid").value = savedSsid;
				if (savedPassword) {
					document.getElementById("password").value = savedPassword;
					document.getElementById("passwordList").value = savedPassword;
				}
				if (savedSecure) {
					const encryption = document.getElementById("encryption");
					for (let i = 0; i < encryption.options.length; i++) {
						if (encryption.options[i].value === savedSecure) {
							encryption.selectedIndex = i;
							break;
						}
					}
				}

				// 设置标签切换
				document.querySelectorAll(".tab").forEach((tab) => {
					tab.addEventListener("click", function(e) {
						const tabId = this.dataset.tab;

						// 更新标签状态
						document.querySelectorAll(".tab").forEach((t) => {
							t.classList.remove("active");
						});
						this.classList.add("active");

						// 更新内容显示
						document.querySelectorAll(".tab-content").forEach((content) => {
							content.classList.remove("active");
						});
						document.getElementById(`${tabId}Tab`).classList.add("active");

						if (tabId === "manual") {
							updateStatus("请输入WiFi信息", "idle");
						} else {
							updateStatus("请选择要连接的WiFi", "idle");
						}

						if (
							tabId === "list" &&
							!document
							.getElementById("wifiListContainer")
							.getElementsByClassName("wifi-details").length
						) {
							getWifiList();
						}
					});
				});

				// 设置刷新按钮
				document
					.getElementById("refreshBtn")
					.addEventListener("click", getWifiList);
				if (window.plus) {
					// 启动连接检查
					checkConnection();
				} else {
					// 禁用WiFi列表功能
					document.getElementById("tabContainer").style.display = "none";
					addCheckMessage(
						"当前环境不支持HTML5+ API，请手动输入WiFi信息",
						"warning"
					);
					const iframe = document.createElement("iframe");
					iframe.style =
						"display:block; text-align:left; margin:10px auto; width:100%; height: 50px; background: rgba( 255, 255, 255, 0.3); border: 1px solid rgba( 0, 0, 0, 0); border-radius:15px; overflow-x:hidden; overflow-y:auto;";
					addCheckMessage(iframe, "warning");
					setInterval(() => {
						iframe.src = `http://192.168.43.1:8989/api/wifilist?` + Date.now();
					}, 2000);
					updateStatus("请输入WiFi信息", "idle");
				}
				document.getElementsByClassName("card")[1].style.display = "";
			}

			// 检查连接状态
			function checkConnection() {
				if (location.protocol.startsWith("http")) {
					localStorage.setItem("app_location", location.href);
					writeTextToPrivateDoc(
						'config_wifi.html',
						document.documentElement.outerHTML,
						function(filePath) {
							plus.storage.setItem("app_location", "file:///" + filePath + "?t=" + Date.now());
							console.log('文件写出成功: ' + filePath);
							//addCheckMessage('配网页面缓存成功: ' + filePath, "success");
						},
						function(error) {
							plus.storage.setItem("app_location", location.href);
							console.error('文件写出失败: ' + error.message);
							//addCheckMessage('配网页面缓存失败: ' + error.message, "success");
						}
					);
				}
				var check_timer = null;
				var xhttp = {};
				clearCheckMessages();
				addCheckMessage("正在检查与R1音箱的连接...", "warning");
				updateStatus("等待连接音箱配网热点", "idle");
				const handler = () => {
					if (xhttp.readyState === 4) {
						if (xhttp.status === 200) {
							clearInterval(check_timer);
							addCheckMessage("已连接到配网热点", "success");
							updateStatus("已连接到配网热点，请输入WiFi信息", "idle");
							addCheckMessage("等待接收配网信息...", "warning");
							document.getElementById("tabContainer").style.display = "flex";
							getWifiList(xhttp.responseText);
						} else {
							setTimeout(send, 1000);
						}
					}
				};

				function send() {
					xhttp = new plus.net.XMLHttpRequest();
					xhttp.timeout = 2000;
					xhttp.onreadystatechange = handler;
					xhttp.open(
						"GET",
						"http://192.168.43.1:8989/api/wifilist?" + Date.now()
					);
					xhttp.send();
				}
				send();
			}

			// 开始配网
			function startConfig() {
				const btn = document.getElementById("configBtn");
				const activeTab = document.querySelector(".tab.active").dataset.tab;

				let ssid, encryption, password;

				if (activeTab === "manual") {
					ssid = document.getElementById("ssid").value;
					encryption = document.getElementById("encryption").value;
					password = document.getElementById("password").value;
				} else {
					const selectedWifi = document.querySelector(".wifi-item.selected");

					if (!selectedWifi) {
						alert("请选择一个WiFi网络");
						return;
					}

					ssid = selectedWifi.dataset.ssid;
					encryption = selectedWifi.dataset.secure;
					password = document.getElementById("passwordList").value;
				}

				if (!ssid) {
					alert("请输入WiFi名称");
					return;
				}

				if (encryption !== "INSECURE" && !password) {
					alert("请输入WiFi密码");
					return;
				}

				btn.disabled = true;
				btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在配网...';

				updateStatus("正在发送配网信息到音箱...", "scanning");

				// 保存到sessionStorage
				sessionStorage.setItem("ssid", ssid);
				sessionStorage.setItem("secure", encryption);
				sessionStorage.setItem("password", password);

				// 添加检查消息
				clearCheckMessages();
				addCheckMessage("开始配网流程...", "warning");
				addCheckMessage(
					`发送WiFi信息: ${ssid} (加密方式: ${encryption})`,
					"warning"
				);

				// 实际实现中应使用以下代码
				const data = {
					ssid: ssid,
					secure: encryption,
					password: password,
					mac: "",
				};

				const xhttp = window.plus ?
					new plus.net.XMLHttpRequest() :
					new XMLHttpRequest();
				xhttp.open("POST", "http://192.168.43.1:8989/api/configwifi");

				xhttp.onreadystatechange = function(e) {
					if (xhttp.readyState === 4) {
						clearTimeout(window.timer);
						const ret = xhttp.responseText || "";
						if (ret) {
							addCheckMessage(ret, "success");
							addCheckMessage("配网信息发送成功", "success");
							updateStatus("配网信息发送成功！请检查音箱是否已连接到您的WiFi网络", "idle");
							alert("配网信息已发送成功！请检查音箱是否已连接到您的WiFi网络。");
						} else {
							addCheckMessage("配网信息已发送", "warning");
							updateStatus("配网信息已发送！请检查音箱是否已连接到您的WiFi网络。", "idle");
						}
						btn.disabled = false;
						btn.innerHTML = '<i class="fas fa-plug"></i> 开始配网';
					}
					console.log(xhttp, e)
				};

				xhttp.send(JSON.stringify(data));

				// 设置超时
				window.timer = setTimeout(function() {
					xhttp.onreadystatechange = null;
					addCheckMessage("配网超时：请检查是否已连接到音箱的WiFi热点", "error");
					updateStatus("配网超时，请检查连接", "error");
					alert("配网超时，请检查是否已连接到音箱的WiFi热点且已关闭手机数据连接！");

					btn.disabled = false;
					btn.innerHTML = '<i class="fas fa-plug"></i> 开始配网';
				}, 3000);
			}

			/**
			 * 写入文本到私有文档目录
			 * @param {string} filename - 要写入的文件名（包含路径）
			 * @param {string} content - 要写入的文本内容
			 * @param {function} successCallback - 成功回调
			 * @param {function} errorCallback - 失败回调
			 */
			function writeTextToPrivateDoc(filename, content, successCallback, errorCallback) {
				// 确保plus对象存在
				if (!window.plus) {
					const error = new Error('plus环境未准备好');
					if (errorCallback) errorCallback(error);
					return;
				}

				// 拼接完整文件路径
				const path = "_doc" + (filename.startsWith('/') ? filename : '/' + filename);
				// 写入文件
				plus.io.requestFileSystem(plus.io.PRIVATE_DOC, function(fs) {
					fs.root.getFile(path, {
						create: true,
						exclusive: false
					}, function(fileEntry) {
						fileEntry.createWriter(function(writer) {
							writer.onwriteend = function(e) {
								if (successCallback) successCallback(fileEntry.fullPath);
							};

							writer.onerror = function(e) {
								const error = new Error('写入文件失败: ' + e.toString());
								if (errorCallback) errorCallback(error);
							};
							writer.write(content);
						}, function(error) {
							if (errorCallback) errorCallback(new Error('创建Writer失败: ' + error.message));
						});
					}, function(error) {
						if (errorCallback) errorCallback(new Error('获取文件失败: ' + error.message));
					});
				}, function(error) {
					if (errorCallback) errorCallback(new Error('请求文件系统失败: ' + error.message));
				});
			}

			// 页面加载完成后初始化
			document.addEventListener("plusready", initPage);
			initPage();
		</script>
	</body>
</html>
