<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ADB设备控制台</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/images/app-icon.png" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/tools/adb.css" />
    <script src="../../assets/js/shared/config.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-bg"></div>
        <h1><i class="fas fa-mobile-alt"></i> ADB设备控制台</h1>
      </header>

      <div class="tab-container">
        <div class="tab active" data-tab="console">控制台</div>
        <div class="tab" data-tab="device">设备信息</div>
        <div class="tab" data-tab="files">文件管理</div>
        <div class="tab" data-tab="apps">应用管理</div>
      </div>

      <!-- 控制台标签页 -->
      <div class="tab-content active" id="consoleTab">
        <div class="card">
          <div class="card-title"><i class="fas fa-terminal"></i> ADB控制台</div>

          <div class="connection-status">
            <div id="statusIndicator" class="status-indicator status-disconnected"></div>
            <span id="statusText">设备状态: 等待ADB初始化</span>
          </div>

          <div id="consoleOutput" class="console-container"></div>
          <div class="form-group">
            <input
              type="search"
              id="consoleInput"
              class="form-input"
              placeholder="输入ADB命令，按Enter执行"
              disabled
            />
          </div>
          <div class="btn-group">
            <button id="clearConsoleBtn" class="btn-secondary">
              <i class="fas fa-broom"></i> 清除控制台
            </button>
            <button id="shellBtn" class="btn-info" disabled>
              <i class="fas fa-terminal"></i> 进入Shell
            </button>
          </div>

          <div class="device-selector">
            <div class="form-group">
              <label class="form-label">连接方式</label>
              <div class="tab-container" id="connectionTabContainer">
                <div class="tab" data-tab="usb">USB连接</div>
                <div class="tab active" data-tab="wifi">WiFi连接</div>
              </div>
            </div>

            <div class="form-group" id="wifiSettings" style="display: none">
              <label class="form-label">设备IP地址</label>
              <input type="text" id="ipAddress" class="form-input" placeholder="192.168.x.x" />
            </div>

            <div class="form-group" id="deviceListGroup" style="display: none">
              <label class="form-label">选择设备</label>
              <select id="deviceSelect" class="form-select">
                <option value="">-- 请选择设备 --</option>
              </select>
            </div>
          </div>

          <div class="btn-group">
            <button id="connectBtn" class="btn-primary" style="display: none" disabled>
              <i class="fas fa-plug"></i> 连接
            </button>
            <button id="disconnectBtn" class="btn-danger" style="display: none" disabled>
              <i class="fas fa-power-off"></i> 断开
            </button>
            <button id="refreshDevicesBtn" class="btn-secondary" style="display: none" disabled>
              <i class="fas fa-sync-alt"></i> 刷新
            </button>
            <button id="backHomeBtn" class="btn-secondary">
              <i class="fas fa-home"></i> 返回首页
            </button>
          </div>
        </div>
      </div>

      <!-- 设备信息标签页 -->
      <div class="tab-content" id="deviceTab">
        <div class="card">
          <div class="card-title"><i class="fas fa-microchip"></i> 设备信息</div>

          <div class="device-card">
            <div class="device-info-row">
              <div class="device-info-label">设备名称:</div>
              <div class="device-info-value" id="deviceName">未知</div>
            </div>
            <div class="device-info-row" style="display: none">
              <div class="device-info-label">设备型号:</div>
              <div class="device-info-value" id="deviceModel">未知</div>
            </div>
            <div class="device-info-row" style="display: none">
              <div class="device-info-label">设备ID:</div>
              <div class="device-info-value" id="deviceId">未连接</div>
            </div>
            <div class="device-info-row">
              <div class="device-info-label">设备IP:</div>
              <div class="device-info-value" id="deviceIP">未连接</div>
            </div>
            <div class="device-info-row">
              <div class="device-info-label">设备SN:</div>
              <div class="device-info-value" id="deviceSN">未连接</div>
            </div>
            <div class="device-info-row">
              <div class="device-info-label">固件版本:</div>
              <div class="device-info-value" id="firmwareVersion">未知</div>
            </div>
            <div class="device-info-row">
              <div class="device-info-label">Android版本:</div>
              <div class="device-info-value" id="androidVersion">未知</div>
            </div>
            <div class="device-info-row" style="display: none">
              <div class="device-info-label">CPU信息:</div>
              <div class="device-info-value" id="cpuInfo">未知</div>
            </div>
            <div class="device-info-row">
              <div class="device-info-label">内存信息:</div>
              <div class="device-info-value" id="memoryInfo">未知</div>
            </div>
            <div class="device-info-row">
              <div class="device-info-label">存储空间:</div>
              <div class="device-info-value" id="storageInfo">未知</div>
            </div>
            <div class="device-info-row" style="display: none">
              <div class="device-info-label">电池状态:</div>
              <div class="device-info-value" id="batteryStatus">未知</div>
            </div>
          </div>

          <div class="btn-group">
            <button id="rebootDeviceBtn" class="btn-warning">
              <i class="fas fa-power-off"></i> 重启设备
            </button>
            <button id="refreshDeviceInfoBtn" class="btn-secondary">
              <i class="fas fa-sync-alt"></i> 刷新信息
            </button>
          </div>
          <div class="progress-text" id="deviceProgressText"></div>
          <div class="progress-container" id="deviceProgress">
            <div class="progress-bar"></div>
          </div>
        </div>
      </div>

      <!-- 文件管理标签页 -->
      <div class="tab-content" id="filesTab">
        <div class="card">
          <div class="card-title"><i class="fas fa-folder-open"></i> 文件浏览器</div>
          <div class="form-group">
            <div class="btn-group">
              <button id="homeBtn" class="btn-secondary"><i class="fas fa-home"></i> 主目录</button>
              <button id="refreshFilesBtn" class="btn-secondary">
                <i class="fas fa-sync-alt"></i> 刷新目录
              </button>
            </div>
          </div>
          <div class="form-group">
            <input type="text" id="currentPath" class="form-input" value="/sdcard/" />
          </div>
          <div id="fileBrowser" class="file-browser"></div>
          <div class="btn-group">
            <button id="uploadFileBtn" class="btn-primary" disabled>
              <i class="fas fa-upload"></i> 上传文件
            </button>
            <button id="createFolderBtn" class="btn-secondary">
              <i class="fas fa-folder-plus"></i> 新建文件夹
            </button>
          </div>
          <div class="progress-text" id="fileProgressText"></div>
          <div class="progress-container" id="fileProgress">
            <div class="progress-bar"></div>
          </div>
        </div>
      </div>

      <!-- 文件操作弹窗 -->
      <div id="fileActionModal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="fileActionTitle">文件操作</h3>
            <span id="fileActionClose" class="close">&times;</span>
          </div>
          <div class="modal-body">
            <p id="fileActionPath" style="display: none"></p>
            <p id="fileActionPerm" style="display: none"></p>
            <div class="btn-group">
              <button id="installFileAppBtn" class="btn-primary" style="display: none">
                <i class="fas fa-download"></i> 安装
              </button>
              <button id="downloadFileBtn" class="btn-warning">
                <i class="fas fa-download"></i> 下载
              </button>
              <button id="deleteFileBtn" class="btn-danger">
                <i class="fas fa-trash"></i> 删除
              </button>
              <button id="ReNameFileBtn" class="btn-danger">
                <i class="fas fa-edit"></i> 重命名
              </button>
              <button id="SetFilePermissionBtn" class="btn-danger">
                <i class="fas fa-cog"></i> 设置权限
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 应用管理标签页 -->
      <div class="tab-content" id="appsTab">
        <div class="card">
          <div class="card-title"><i class="fas fa-mobile"></i> 应用管理</div>
          <div class="form-group">
            <div class="btn-group">
              <button id="installAppBtn" class="btn-primary">
                <i class="fas fa-download"></i> 安装应用
              </button>
              <button id="refreshAppsBtn" class="btn-secondary">
                <i class="fas fa-sync-alt"></i> 刷新应用
              </button>
            </div>
          </div>
          <div class="form-group">
            <input type="text" id="appSearch" class="form-input" placeholder="搜索应用..." />
          </div>
          <div id="appList" class="file-browser"></div>
          <div class="progress-text" id="appProgressText"></div>
          <div class="progress-container" id="appProgress">
            <div class="progress-bar"></div>
          </div>
        </div>
      </div>

      <!-- 应用操作弹窗 -->
      <div id="appActionModal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="appActionTitle">应用操作</h3>
            <span id="appActionClose" class="close">&times;</span>
          </div>
          <div class="modal-body">
            <p id="appActionPackage" style="display: none"></p>
            <p id="appActionPath"></p>
            <div class="btn-group">
              <!--<button id="launchAppBtn" class="btn-success">
							<i class="fas fa-play"></i> 启动应用
						</button>-->
              <button id="enableAppBtn" class="btn-info" disabled>
                <i class="fas fa-play"></i> 启用应用
              </button>
              <button id="disabledAppBtn" class="btn-warning" disabled>
                <i class="fas fa-ban"></i> 停用应用
              </button>
              <button id="unHideAppBtn" class="btn-info" disabled>
                <i class="fas fa-eye"></i> 显示应用
              </button>
              <button id="hideAppBtn" class="btn-warning" disabled>
                <i class="fas fa-eye-slash"></i> 隐藏应用
              </button>
              <button id="clearAppBtn" class="btn-danger">
                <i class="fas fa-trash"></i> 清除数据
              </button>
              <button id="uninstallAppBtn" class="btn-danger">
                <i class="fas fa-trash"></i> 卸载应用
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../../assets/js/tools/adb-page.js"></script>
  </body>
</html>
