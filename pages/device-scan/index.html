<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网络设备扫描工具</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/images/app-icon.png" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/tools/device-scan.css" />
  <script src="../../assets/js/shared/config.js"></script>
</head>
  <body>
    <div class="container">
      <header>
        <h1><i class="fas fa-wifi"></i> 网络设备扫描工具</h1>
      </header>

      <div class="dashboard">
        <div class="card">
          <div class="card-title">
            <i class="fas fa-network-wired"></i> 网络控制面板
          </div>
          <div class="controls">
            <div class="mode-tabs">
              <div class="mode-tab active" data-mode="dlna">DLNA设备扫描</div>
              <div class="mode-tab" data-mode="airplay">AirPlay设备扫描</div>
            </div>

            <p id="mode-description">
              点击下方按钮开始扫描网络中的DLNA设备。扫描可能需要几秒钟时间，请耐心等待。
            </p>

            <div class="btn-group">
              <button id="scanBtn" class="btn-scan">
                <i class="fas fa-search"></i> 开始扫描
              </button>
              <button id="stopBtn" class="btn-stop" disabled>
                <i class="fas fa-stop"></i> 停止扫描
              </button>
              <button id="backHomeBtn" class="btn-home">
                <i class="fas fa-home"></i> 返回首页
              </button>
            </div>

            <div class="status">
              <div id="statusIndicator" class="status-indicator idle"></div>
              <span id="statusText">等待环境初始化...</span>
            </div>
          </div>
        </div>

        <div class="card" style="grid-column: 1 / -1">
          <div class="card-title">
            <i class="fas fa-laptop"></i> 发现的设备列表
          </div>
          <div class="devices-list" id="devicesList"></div>
        </div>
      </div>

      <footer>
        <p>网络设备扫描工具 - 支持DLNA和AirPlay协议</p>
      </footer>
    </div>

    <script src="../../assets/js/tools/device-scan-page.js"></script>
  </body>
</html>
